<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTYBELLE ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 헤더 -->
    <header class="header">
        <div class="profile">
            <img src="Untitled45_20260901012016.png" alt="Belle">
            <div class="profile-name">벨디</div>
        </div>
    </header>


    <!-- 카테고리 + 언어 -->
    <div class="category-language-row">

        <nav class="categories">
            <button class="category active" data-category="all" data-i18n="all">전체</button>
            <button class="category" data-category="photo" data-i18n="photo">사진</button>
            <button class="category" data-category="video" data-i18n="video">영상</button>
            <button class="category" data-category="reels" data-i18n="reels">릴스</button>
        </nav>

        <div class="language-selector">

            <button
                class="language-button"
                id="languageButton"
                onclick="toggleLanguageMenu()"
                aria-label="Language"
            >
                <span class="language-flag" id="currentFlag">🇰🇷</span>
                <span class="language-name" id="currentLanguage">한국어</span>
                <span class="language-arrow">⌄</span>
            </button>

            <div class="language-menu" id="languageMenu">

                <button
                    class="language-option active"
                    onclick="changeLanguage('ko')"
                    data-language="ko"
                >
                    <span class="option-flag">🇰🇷</span>
                    <span>한국어</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('en')"
                    data-language="en"
                >
                    <span class="option-flag">🇺🇸</span>
                    <span>English</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('ja')"
                    data-language="ja"
                >
                    <span class="option-flag">🇯🇵</span>
                    <span>日本語</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('zh')"
                    data-language="zh"
                >
                    <span class="option-flag">🇨🇳</span>
                    <span>中文</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('th')"
                    data-language="th"
                >
                    <span class="option-flag">🇹🇭</span>
                    <span>ไทย</span>
                </button>

            </div>
        </div>

    </div>


    <!-- 검색 / 정렬 -->
    <section class="tools">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                data-i18n-placeholder="search"
                placeholder="검색"
            >
        </div>

        <div class="sort-buttons">
            <button id="newestBtn" class="sort active" data-i18n="newest">
                최신순
            </button>

            <button id="oldestBtn" class="sort" data-i18n="oldest">
                과거순
            </button>
        </div>

    </section>


    <!-- 아카이브 -->
    <main class="archive" id="archive"></main>


    <!-- 이미지 확대 -->
    <div class="modal" id="imageModal">

        <button class="modal-close" id="modalClose">×</button>

        <img id="modalImage" src="" alt="">

    </div>


    <!-- 푸터 -->
    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-left">
                <span>© 2026 TTYBELLE</span>
                <span>·</span>
                <span>HERB3LLE</span>
            </div>

            <div class="footer-links">

                <a
                    href="https://x.com/herb3lle?s=11"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    X
                </a>

                <a
                    href="https://spin-spin.com/HERB3LLE"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Spin
                </a>

                <a
                    href="https://curious.quizby.me/herb3lle"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Curious
                </a>

            </div>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
