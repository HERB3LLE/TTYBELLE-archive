<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTYBELLE ARCHIVE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 대표 이미지 -->
    <section class="hero">
        <img
            src="9DB06884-25D8-4302-8771-F987BEF77670.jpeg"
            alt="KISS OF LIFE NATTY BELLE"
        >

        <div class="hero-text">
            KISSOFLIFE<br>
            NATTY BELLE
        </div>
    </section>

    <!-- 사이트 제목 -->
    <header class="header">

        <h1>TTYBELLE ARCHIVE</h1>

        <p class="description">
            KISS OF LIFE NATTY & BELLE
        </p>

    </header>

    <!-- 카테고리 + 언어 -->
    <div class="category-language-row">

        <nav class="categories">

            <button
                class="category active"
                onclick="filterItems('all', this)"
                data-i18n="all"
            >
                ALL
            </button>

            <button
                class="category"
                onclick="filterItems('photo', this)"
                data-i18n="photo"
            >
                PHOTO
            </button>

            <button
                class="category"
                onclick="filterItems('video', this)"
                data-i18n="video"
            >
                VIDEO
            </button>

            <button
                class="category"
                onclick="filterItems('reels', this)"
                data-i18n="reels"
            >
                REELS
            </button>

        </nav>

        <!-- 언어 선택 -->
        <div class="language-selector">

            <button
                class="language-button"
                id="languageButton"
                onclick="toggleLanguageMenu()"
                aria-label="Language"
            >
                <span
                    class="language-flag"
                    id="currentFlag"
                >🇰🇷</span>

                <span
                    class="language-name"
                    id="currentLanguage"
                >한국어</span>

                <span class="language-arrow">⌄</span>
            </button>

            <div
                class="language-menu"
                id="languageMenu"
            >

                <button
                    class="language-option active"
                    onclick="changeLanguage('ko')"
                    data-language="ko"
                >
                    <span class="option-flag">🇰🇷</span>
                    <span>한국어</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('en')"
                    data-language="en"
                >
                    <span class="option-flag">🇺🇸</span>
                    <span>English</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('ja')"
                    data-language="ja"
                >
                    <span class="option-flag">🇯🇵</span>
                    <span>日本語</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('zh')"
                    data-language="zh"
                >
                    <span class="option-flag">🇨🇳</span>
                    <span>中文</span>
                </button>

                <button
                    class="language-option"
                    onclick="changeLanguage('th')"
                    data-language="th"
                >
                    <span class="option-flag">🇹🇭</span>
                    <span>ไทย</span>
                </button>

            </div>

        </div>

    </div>

    <!-- 검색 / 정렬 -->
    <section class="tools">

        <input
            id="search"
            type="search"
            placeholder="Search"
            oninput="searchItems()"
        >

        <select
            id="sort"
            onchange="changeSort()"
        >
            <option
                value="new"
                data-i18n="newest"
            >
                최신순
            </option>

            <option
                value="old"
                data-i18n="oldest"
            >
                과거순
            </option>

        </select>

    </section>

    <!-- 자료 -->
    <main
        id="archive"
        class="archive"
    ></main>

    <!-- 사진 확대 -->
    <div
        id="imageModal"
        class="modal"
        onclick="closeModal()"
    >

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

        <img
            id="modalImage"
            src=""
            alt=""
        >

    </div>

    <!-- 푸터 -->
    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-left">
                © 2026 NATTY & BELLE · HERB3LLE
            </div>

            <div class="footer-links">

                <a
                    href="https://x.com/herb3lle?s=11"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    X
                </a>

                <a
                    href="https://spin-spin.com/HERB3LLE"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Spin
                </a>

                <a
                    href="https://curious.quizby.me/herb3lle"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Curious
                </a>

            </div>

        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
