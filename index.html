<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTYBELLE ARCHIVE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 대표 이미지 -->
    <section class="hero">
        <img
            src="8884D242-AB9B-4451-B5B3-92B7F2D99E78.jpeg"
            alt="KISS OF LIFE NATTY BELLE"
        >

        <div class="hero-text">
            KISSOFLIFE<br>
            NATTY BELLE
        </div>
    </section>


    <!-- 사이트 제목 -->
    <header class="header">

        <h1>TTYBELLE ARCHIVE</h1>

        <p class="description">
            KISS OF LIFE NATTY & BELLE
        </p>

    </header>


    <!-- 카테고리 -->
    <nav class="categories">

        <button
            class="category active"
            onclick="filterItems('all', this)"
        >
            ALL
        </button>

        <button
            class="category"
            onclick="filterItems('photo', this)"
        >
            PHOTO
        </button>

        <button
            class="category"
            onclick="filterItems('video', this)"
        >
            VIDEO
        </button>

        <button
            class="category"
            onclick="filterItems('reels', this)"
        >
            REELS
        </button>

    </nav>


    <!-- 검색 / 정렬 -->
    <section class="tools">

        <input
            id="search"
            type="search"
            placeholder="Search"
            oninput="searchItems()"
        >

        <select
            id="sort"
            onchange="changeSort()"
        >
            <option value="new">최신순</option>
            <option value="old">과거순</option>
        </select>

    </section>


    <!-- 자료 -->
    <main
        id="archive"
        class="archive"
    ></main>


    <!-- 사진 확대 -->
    <div
        id="imageModal"
        class="modal"
        onclick="closeModal()"
    >

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>

        <img
            id="modalImage"
            src=""
            alt=""
        >

    </div>


    <script src="script.js"></script>

</body>
</html>
